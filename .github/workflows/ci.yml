name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and Test
    runs-on: macos-latest

    steps:
      - name: Checkout
        # actions/checkout v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build CLI target
        run: |
          xcodebuild \
            -project metamove.xcodeproj \
            -target metamove_cli \
            -configuration Debug \
            SYMROOT="$PWD/build/Xcode/Products" \
            OBJROOT="$PWD/build/Xcode/Intermediates" \
            MACOSX_DEPLOYMENT_TARGET=10.13 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Build app target without signing
        run: |
          xcodebuild \
            -project metamove.xcodeproj \
            -target metamove \
            -configuration Debug \
            SYMROOT="$PWD/build/Xcode/Products" \
            OBJROOT="$PWD/build/Xcode/Intermediates" \
            MACOSX_DEPLOYMENT_TARGET=10.13 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build
